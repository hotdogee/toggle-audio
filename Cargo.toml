[package]
name = "toggle-audio"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Flip Windows audio output between two devices in milliseconds"
license = "MIT"
repository = "https://github.com/hotdogee/toggle-audio"
authors = ["Han Lin <hotdogee@gmail.com>"]
keywords = ["audio", "windows", "default-device", "hotkey", "cli"]
categories = ["command-line-utilities", "multimedia::audio", "os::windows-apis"]
publish = false

[lib]
name = "toggle_audio"
path = "src/lib.rs"

# Console subsystem + `consoleAllocationPolicy=detached` manifest (see assets/app.manifest).
[[bin]]
name = "toggle-audio"
path = "src/bin/toggle-audio.rs"

# Windows (GUI) subsystem: never creates a console window.
[[bin]]
name = "toggle-audiow"
path = "src/bin/toggle-audiow.rs"

[workspace]
members = ["."]
# The benchmark crate keeps its own profile and lock file.
exclude = ["bench/rust"]

[dependencies]
# `#[interface]` expands to `::windows_core::...` paths, so windows-core must be a direct
# dependency pinned to the exact version the `windows` crate uses.
windows-core = "=0.62.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies.windows]
version = "=0.62.2"
features = [
    # Core Audio (src/audio.rs)
    "Win32_Foundation",                   # HWND, HANDLE, PROPERTYKEY, error codes
    "Win32_Media_Audio",                  # IMMDeviceEnumerator, MMDeviceEnumerator, eRender, ERole, DEVICE_STATE_*
    "Win32_System_Com",                   # CoInitializeEx, CoCreateInstance, CoTaskMemFree, STGM_READ
    "Win32_System_Com_StructuredStorage", # PROPVARIANT, PropVariantClear
    "Win32_System_Variant",               # VT_LPWSTR; also gates PROPVARIANT / IPropertyStore::GetValue
    "Win32_UI_Shell_PropertiesSystem",    # IPropertyStore (OpenPropertyStore is gated on it)
    "Win32_Devices_FunctionDiscovery",    # PKEY_Device_FriendlyName
    # Console output and error reporting (src/console.rs)
    "Win32_System_Console",               # AttachConsole, FreeConsole, GetConsoleProcessList, WriteConsoleW
    "Win32_Storage_FileSystem",           # WriteFile, GetFileType
    "Win32_System_IO",                    # WriteFile is gated on it
    # Configuration path (src/config.rs)
    "Win32_UI_Shell",                     # SHGetKnownFolderPath (fallback when APPDATA is unset)
    # Timing (src/timing.rs)
    "Win32_System_Threading",             # GetCurrentProcess, GetProcessTimes; CreateMutexW (gui)
    # Settings dialog (src/gui/)
    "Win32_Graphics_Gdi",                 # MonitorFromPoint, GetMonitorInfoW
    "Win32_Security",                     # CreateMutexW (its SECURITY_ATTRIBUTES parameter)
    "Win32_System_LibraryLoader",         # GetModuleHandleW
    "Win32_System_DataExchange",          # OpenClipboard, EmptyClipboard, SetClipboardData
    "Win32_System_Memory",                # GlobalAlloc, GlobalLock, GlobalUnlock
    "Win32_System_Ole",                   # CF_UNICODETEXT
    "Win32_UI_Controls",                  # InitCommonControlsEx, LoadIconMetric, CB_SETMINVISIBLE
    "Win32_UI_WindowsAndMessaging",       # DialogBoxParamW, SendMessageW, MessageBoxW, FindWindowW
]

[build-dependencies]
embed-resource = "3.0.11"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
